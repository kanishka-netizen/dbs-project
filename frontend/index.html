<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Analyse a relational schema against 1NF through 5NF, see why each normal form holds or fails, and visualise the decomposition."
    />
    <title>Normalization Visualizer</title>
    <script>
      // Applied before first paint so the app does not flash the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('dbs-theme');
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {
          /* localStorage unavailable — fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
